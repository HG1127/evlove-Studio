name: Production Smoke

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Main alias smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://500ipo-evolve-studio.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Find latest deploy-relevant commit
        shell: bash
        run: |
          set -euo pipefail
          candidate="$EXPECTED_SHA"
          while parent="$(git rev-parse "$candidate^" 2>/dev/null)"; do
            if git diff --name-only "$parent" "$candidate" | grep -Ev '^(docs/|\.github/)' >/dev/null; then
              break
            fi
            candidate="$parent"
          done
          echo "DEPLOY_RELEVANT_SHA=$candidate" >> "$GITHUB_ENV"
          echo "Latest deploy-relevant commit: $candidate"

      - name: Wait for main alias to reach a verified commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            body="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/evolution/build-info" || true)"
            commit="$(printf '%s' "$body" | jq -r '.commitSha // empty' 2>/dev/null || true)"
            ref="$(printf '%s' "$body" | jq -r '.commitRef // empty' 2>/dev/null || true)"
            env_name="$(printf '%s' "$body" | jq -r '.vercelEnvironment // empty' 2>/dev/null || true)"
            if { [ "$commit" = "$EXPECTED_SHA" ] || [ "$commit" = "$DEPLOY_RELEVANT_SHA" ]; } && [ "$ref" = "main" ] && [ "$env_name" = "production" ]; then
              echo "Main alias is serving $commit"
              echo "SERVED_SHA=$commit" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for main alias: attempt $attempt/72, observed=${commit:-none}, accepted=$EXPECTED_SHA or $DEPLOY_RELEVANT_SHA"
            sleep 5
          done
          echo "::error::Main alias did not reach the verified commit or its docs-only predecessor within six minutes."
          exit 1

      - name: Homepage renders
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/home.html --write-out '%{http_code}' "$PRODUCTION_URL/")"
          test "$status" = "200"
          test -s /tmp/home.html

      - name: Critical production configuration is ready
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PRODUCTION_URL/api/evolution/public-readiness" > /tmp/readiness.json
          if ! jq -e '
            .probeMode == "passive-config" and
            (.blockers | type == "array") and
            .dataPlane.configured == true and
            .dataPlane.secureCredential == true and
            .workflow.cronConfigured == true and
            .security.configured == true and
            .serverAi == true
          ' /tmp/readiness.json >/dev/null; then
            echo "::error::Production backend is missing a critical configuration."
            jq -c '{dataPlane: (.dataPlane | {configured, secureCredential, credentialMode, configValid, issueFields, urlPresent, secretPresent, publishablePresent}), security: (.security | {configured, enforced}), serverAi}' /tmp/readiness.json
            jq -r '.blockers[] | select(.severity == "error") | .code' /tmp/readiness.json
            exit 1
          fi

      - name: Protected business API stays closed on the public alias
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/protected.json --write-out '%{http_code}' "$PRODUCTION_URL/api/evolution/backend-health")"
          if [ "$status" != "401" ]; then
            echo "::error::Expected public backend-health to remain 401, got $status."
            cat /tmp/protected.json || true
            exit 1
          fi

      - name: Scheduled repair route requires its Cron token
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/scheduled.json --write-out '%{http_code}' "$PRODUCTION_URL/api/evolution/jobs/reconcile-scheduled")"
          if [ "$status" != "401" ]; then
            echo "::error::Expected unauthenticated scheduled reconciliation to remain 401, got $status."
            exit 1
          fi

      - name: Node 24 for production browser smoke
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install production browser smoke dependencies
        run: |
          npm ci --prefix runner-gateway
          node runner-gateway/node_modules/playwright/cli.js install chromium

      - name: Production UI renders in read-only local mode
        env:
          RUNNER_BROWSER_CI_NO_SANDBOX: "1"
        run: node scripts/production-ui-smoke.mjs

      - name: Smoke summary
        shell: bash
        run: |
          {
            echo "## Production smoke passed"
            echo ""
            echo "- Main alias commit: `$SERVED_SHA`"
            echo "- Quality Gate commit: `$EXPECTED_SHA`"
            echo "- Homepage: 200"
            echo "- Public readiness: Supabase, server identity, server AI, and Cron configured"
            echo "- Public backend-health: 401 as required"
            echo "- Scheduled repair without Cron token: 401 as required"
            echo "- Public UI: four desktop routes and mobile layout rendered in read-only local mode"
          } >> "$GITHUB_STEP_SUMMARY"
