name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Architecture / Tests / Build / Runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Full test suite
        run: pnpm exec vitest run --maxWorkers 1

      - name: Production build
        run: pnpm build

      - name: Install Runner Gateway dependencies
        run: pnpm runner:setup

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Runner Gateway tests
        env:
          RUNNER_BROWSER_CI_NO_SANDBOX: "1"
        run: pnpm runner:test

      - name: Browser E2E
        env:
          RUNNER_BROWSER_CI_NO_SANDBOX: "1"
        run: pnpm test:e2e

      - name: Local UI smoke
        env:
          RUNNER_BROWSER_CI_NO_SANDBOX: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/evolution-ui-smoke
          pnpm dev > /tmp/evolution-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null 2>&1; then
              node scripts/ui-smoke.mjs /tmp/evolution-ui-smoke
              exit 0
            fi
            sleep 1
          done
          cat /tmp/evolution-dev.log
          echo "::error::Local UI server did not become ready on port 8000."
          exit 1
